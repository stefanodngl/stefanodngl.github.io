<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>deposit simulator</title>

    <link
        rel="stylesheet"
        href="style_deposit.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
</head>

<body>

<header>

    <h1>Italian bank deposit</h1>

<nav>

    <div class="hamburger" id="hamburgerBtn">

        <span></span>
        <span></span>
        <span></span>

    </div>

    <div class="mobileMenu" id="mobileMenu">

        <a href="https://stefanodngl.github.io/deposit_sim/how_to_use.html">
            how to use
        </a>

        <a href="https://stefanodngl.github.io/deposit_sim/methodology.html">
            methodology
        </a>

        <a href="https://stefanodngl.github.io" target="_blank">
            about
        </a>

    </div>

    <a href="https://stefanodngl.github.io/deposit_sim/how_to_use.html">
        how to use
    </a>

    <a href="https://stefanodngl.github.io/deposit_sim/methodology.html">
        methodology
    </a>

    <a href="https://stefanodngl.github.io" target="_blank">
        about
    </a>

</nav>
    

</header>

<h2>Compare Italian bank deposit accounts and returns</h2>
    
<main>

    <section class="controls">

        <div class="control-block-a">

            <label>
                <img src="images/money.png" alt="Email" width="15" height="15">
                <a>Deposit amount (in EUR)</a>
            </label>

            <input
                type="number"
                id="amount"
                value="50000">

        </div>
    
        <div class="control-block-a">

            <label>
                <img src="images/line-chart.png" alt="Email" width="15" height="15">
                <a>Periods (months)</a>
            </label>

            <div class="periods">

                <label>
                    <input
                        class="period-checkbox active-period"
                        type="button"
                        value="6">
                </label>

                <label>
                    <input
                        class="period-checkbox active-period"
                        type="button"
                        value="12">
                </label>

                <label>
                    <input
                        class="period-checkbox active-period"
                        type="button"
                        value="24">
                </label>

                <label>
                    <input
                        class="period-checkbox active-period"
                        type="button"
                        value="36">
                </label>

                <label>
                    <input
                        class="period-checkbox active-period"
                        type="button"
                        value="48">
                </label>

                <label>
                    <input
                        class="period-checkbox active-period"
                        type="button"
                        value="60">
                </label>

            </div>

        </div>

        <div class="control-block-b">

            <div class="bankLabel">

                <span>
                    <img src="images/bank.png" alt="Email" width="15" height="15">
                    <a>Search bank</a>
                </span>

                <div class="infoIcon">

                    i

                    <div class="tooltipText">
                        To select multiple banks, hold Ctrl and click on the relative name (max 5 displayed)
                    </div>

                </div>

            </div>

            <input
                type="text"
                id="bankSearch"
                placeholder="Enter bank name...">


            <select
                id="bankSelector"
                multiple
                size="8">
            </select>

        </div>
                

    </section>

    <div id="selectedBanks"></div>

    <section class="chart-card">

        <canvas id="yieldChart"></canvas>

    </section>

    <div class="update-date">

        Deposit rates last update: 10/05/2026

    </div>

</main>

<div class=footer>

    2026 &#xA9; Stefano D'Angelo

</div>
    
<script>

document.addEventListener(
    "DOMContentLoaded",
    function(){

        document
        .getElementById("mobileMenu")
        .classList
        .remove("mobileMenuOpen");

        document
        .getElementById("hamburgerBtn")
        .addEventListener(
            "click",
            function(event){

                event.stopPropagation();

                document
                .getElementById("mobileMenu")
                .classList
                .toggle("mobileMenuOpen");

            }
        );

        document.addEventListener(
            "click",
            function(event){

                const menu =
                    document.getElementById(
                        "mobileMenu"
                    );

                const button =
                    document.getElementById(
                        "hamburgerBtn"
                    );

                if(

                    !menu.contains(
                        event.target
                    )

                    &&

                    !button.contains(
                        event.target
                    )

                ){

                    menu.classList.remove(
                        "mobileMenuOpen"
                    );

                }

            }
        );

    }
);

</script>

<script src="app.js"></script>

</body>

</html>
