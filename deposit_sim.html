<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>deposit comparator</title>

    <link
        rel="stylesheet"
        href="style_deposit.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
</head>

<body>

<header>

    <h1>Italian bank deposit</h1>

    <nav>

        <a href="https://stefanodngl.github.io">
            about
        </a>

        <a href="https://stefanodngl.github.io"> how to use
        </a>

        <a href="https://stefanodngl.github.io"> methodology
        </a>

    </nav>

</header>

<main>

    <section class="controls">

        <div class="control-block">

            <label>
                <b>Deposit amount (in EUR)</b>
            </label>

            <input
                type="number"
                id="amount"
                value="50000">

        </div>
    
        <div class="control-block">

            <label>
                <b>Periods (months)</b>
            </label>

            <div class="periods">

                <label>
                    <input
                        class="period-checkbox"
                        type="checkbox"
                        value="6"
                        checked>
                    6 
                </label>

                <label>
                    <input
                        class="period-checkbox"
                        type="checkbox"
                        value="12"
                        checked>
                    12
                </label>

                <label>
                    <input
                        class="period-checkbox"
                        type="checkbox"
                        value="24"
                        checked>
                    24
                </label>

                <label>
                    <input
                        class="period-checkbox"
                        type="checkbox"
                        value="36"
                        checked>
                    36
                </label>

                <label>
                    <input
                        class="period-checkbox"
                        type="checkbox"
                        value="48"
                        checked>
                    48
                </label>

                <label>
                    <input
                        class="period-checkbox"
                        type="checkbox"
                        value="60"
                        checked>
                    60
                </label>

            </div>

        </div>

        <div class="control-block">

            <div class="bankLabel">

                <span>
                    <b>Search bank</b>
                </span>

                <div class="infoIcon">

                    i

                    <div class="tooltipText">
                        To select multiple banks, hold Ctrl and click on the relative name (max 5 displayed)
                    </div>

                </div>

            </div>

            <input
                type="text"
                id="bankSearch"
                placeholder="Search bank...">

            <div id="selectedBanks"></div>

            <select
                id="bankSelector"
                multiple
                size="8">
            </select>

        </div>
                

    </section>

    <section class="chart-card">

        <canvas id="yieldChart"></canvas>

    </section>

    <div class="update-date">

        Deposit rates last update: 10/05/2026

    </div>

</main>

<footer>

    2026 &#xA9; Stefano D'Angelo

</footer>

<script src="app.js"></script>

</body>

</html>
