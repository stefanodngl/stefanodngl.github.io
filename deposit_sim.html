<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Deposit Comparator</title>

    <link
        rel="stylesheet"
        href="styles.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
</head>

<body>

<header>

    <h1>Deposit Comparator</h1>

    <nav>

        <a href="https://stefanodngl.github.io">
            about
        </a>

        <a href="https://stefanodngl.github.io"> how to use
        </a>

        <a href="https://stefanodngl.github.io"> methodology
        </a>

    </nav>

</header>

<main>

    <section class="controls">

        <div class="control-block">

            <label>
                Deposit Amount (€)
            </label>

            <input
                type="number"
                id="amount"
                value="50000">

        </div>

        <div class="control-block">

            <label>Periods</label>

            <div class="periods">

                <label>
                    <input
                        class="period-checkbox"
                        type="checkbox"
                        value="6"
                        checked>
                    6m
                </label>

                <label>
                    <input
                        class="period-checkbox"
                        type="checkbox"
                        value="12"
                        checked>
                    1y
                </label>

                <label>
                    <input
                        class="period-checkbox"
                        type="checkbox"
                        value="24"
                        checked>
                    2y
                </label>

                <label>
                    <input
                        class="period-checkbox"
                        type="checkbox"
                        value="36"
                        checked>
                    3y
                </label>

                <label>
                    <input
                        class="period-checkbox"
                        type="checkbox"
                        value="48"
                        checked>
                    4y
                </label>

                <label>
                    <input
                        class="period-checkbox"
                        type="checkbox"
                        value="60"
                        checked>
                    5y
                </label>

            </div>

        </div>

        <div class="control-block">

            <label>
                Search Bank
            </label>

            <input
                type="text"
                id="bankSearch"
                placeholder="Search bank...">

            <div id="selectedBanks"></div>

            <select
                id="bankSelector"
                multiple
                size="8">
            </select>

        </div>

    </section>

    <section class="chart-card">

        <canvas id="yieldChart"></canvas>

    </section>

    <div class="update-date">

        Deposit rates last update: 10/05/2026

    </div>

</main>

<footer>

    © Stefano D'Angelo

</footer>

<script src="app.js"></script>

</body>

</html>
